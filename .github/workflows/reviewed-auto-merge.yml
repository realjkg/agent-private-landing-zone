name: Reviewed PR auto-merge (budgeted)

# A small event-driven gate, never a periodic polling job or hosted coding agent.
on:
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing PR number to re-evaluate"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: reviewed-merge-${{ github.event.pull_request.number || github.event.check_suite.head_sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    # check_suite must originate from this repo; never run privileged code from PR branches.
    if: github.event_name != 'check_suite' || github.event.check_suite.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
      checks: read
      issues: read
    steps:
      - name: Verify exact-head review, protections and checks; request native auto-merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            let numbers = [];
            if (context.eventName === 'pull_request_review') {
              numbers = [context.payload.pull_request.number];
            } else if (context.eventName === 'workflow_dispatch') {
              numbers = [Number(context.payload.inputs.pr_number)];
            } else if (context.eventName === 'check_suite') {
              // Only PRs explicitly associated with the completed check suite.
              numbers = (context.payload.check_suite.pull_requests || []).map(p => p.number);
            }
            for (const number of [...new Set(numbers)]) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                  pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) continue;
              // Never merge architectural, shared-contract, identity, security or release-authority changes unattended.
              const labels = (await github.paginate(github.rest.issues.listLabelsOnIssue,
                { owner, repo, issue_number: number })).map(l => l.name);
              if (!labels.includes('automerge:approved-scope') ||
                  labels.some(l => ['design-decision', 'architecture', 'security-boundary', 'act', 'release-gate', 'human-decision'].includes(l))) continue;
              // Supersession is a hard veto, even if all tests and approvals are green.
              // Use explicit labels AND PR relationship metadata. Ambiguous evidence fails closed.
              const blockedLabels = ['superseded', 'superseded-by', 'obsolete', 'do-not-merge'];
              if (labels.some(l => blockedLabels.includes(l) || l.startsWith('superseded-by:'))) continue;
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
              const body = (pr.body || '') + '\\n' + (issue.body || '');
              if (/\b(superseded\s+by|replaced\s+by|obsolete\s+in\s+favor\s+of)\s+(?:[\w.-]+\/[\w.-]+)?#?\d+\b/i.test(body)) continue;
              // An explicit superseding PR can reference the older PR in its title/body.
              // Restrict to open PRs; closed-but-merged replacement references are also
              // caught by the superseded label/body on the older PR.
              const openPRs = await github.paginate(github.rest.pulls.list,
                { owner, repo, state: 'open', per_page: 100 });
              if (openPRs.length > 1000) continue; // bound API spend / ambiguous huge queues
              const referencedAsSuperseded = openPRs.some(other => other.number !== number &&
                new RegExp('\\b(?:supersedes|replaces)\\s+(?:[\\w.-]+\\/[\\w.-]+)?#?' + number + '\\b', 'i')
                  .test((other.title || '') + '\\n' + (other.body || '')));
              if (referencedAsSuperseded) continue;
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number });
              const latest = new Map();
              for (const r of reviews) {
                if (r.user?.login && r.commit_id === pr.head.sha) latest.set(r.user.login, r.state);
              }
              const independent = [...latest].some(([login, state]) =>
                state === 'APPROVED' && login !== pr.user.login);
              if (!independent || [...latest.values()].includes('CHANGES_REQUESTED')) continue;
              // Respect unresolved inline discussions, including comments from coding agents.
              const threads = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!){
                repository(owner:$owner,name:$repo){pullRequest(number:$number){
                  reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}
                }}
              }`, { owner, repo, number });
              const t = threads.repository.pullRequest.reviewThreads;
              if (t.pageInfo.hasNextPage || t.nodes.some(x => !x.isResolved)) continue;
              // Required checks are enforced by GitHub native branch protection.
              // Optional check runs must not block admission or consume extra polling.
              // Do not bypass branch protection. GitHub native auto-merge queues until required checks pass.
              // GitHub API returns an error when auto-merge is disabled or policy forbids this PR.
              try {
                const node = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){pullRequest(number:$number){
                    id mergeStateStatus autoMergeRequest{enabledAt}
                  }}
                }`, { owner, repo, number });
                const p = node.repository.pullRequest;
                if (p.autoMergeRequest || ['DIRTY', 'UNKNOWN'].includes(p.mergeStateStatus)) continue;
                await github.graphql(`mutation($id:ID!,$sha:GitObjectID!){
                  enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH,expectedHeadOid:$sha}){
                    pullRequest{id}
                  }
                }`, { id: p.id, sha: pr.head.sha });
                core.info(`Enabled protected native auto-merge for #${number} at ${pr.head.sha}`);
              } catch (e) {
                core.warning(`#${number} not eligible for native auto-merge: ${e.message}`);
              }
            }
