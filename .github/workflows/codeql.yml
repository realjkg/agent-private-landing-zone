name: CodeQL

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # Fast affected tests cover routine edits. PR CodeQL is reserved for
    # security-sensitive boundaries; weekly and manual scans cover the rest.
    paths:
      - "src/security/**"
      - "src/apply/**"
      - "src/actions/**"
      - "src/identity/**"
      - "src/qualification/lz-live-journey.ts"
      - "src/integrations/ai-studio/operations-mcp-http.ts"
      - "security/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  schedule:
    # Weekly, Mondays 06:00 UTC — matches the repo's Dependabot cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
