name: Sovereign LZ Control Plane Recovery Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/control-plane-recovery.yml"
      - "src/recovery/control-plane/**"
      - "src/cli/control-plane-recovery.ts"
      - "src/cli/operator.ts"
      - "src/release/**"
  workflow_dispatch:

permissions:
  contents: read

# Release-sensitive recovery changes must re-run this isolated restore qualification.
jobs:
  control-plane-recovery:
    name: Encrypted isolated control-plane restore
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Qualify source
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Stage versioned Preview Operate release
        shell: bash
        run: |
          set -euo pipefail
          STAGE=".runs/control-plane/stage"
          rm -rf ".runs/control-plane"
          mkdir -p "$STAGE"
          npm sbom --sbom-format=cyclonedx --package-lock-only > sbom.cdx.json
          cp -R dist "$STAGE/dist"
          cp -R policy "$STAGE/policy"
          cp -R config "$STAGE/config"
          cp package.json package-lock.json alz sbom.cdx.json "$STAGE/"
          chmod +x "$STAGE/alz"
          VERSION="$(node -p "require('./package.json').version")"
          node dist/cli/release-package.js             --root "$STAGE"             --source-commit "$GITHUB_SHA"             --version "$VERSION"

      - name: Create customer-key encrypted state and persistent checkpoint
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/.runs/control-plane/stage"
          EVIDENCE_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$EVIDENCE_KEY"
          echo "AGENTIC_EVIDENCE_KEY=$EVIDENCE_KEY" >> "$GITHUB_ENV"

          cd "$STAGE"
          node --input-type=module <<'NODE'
          import { writeEncryptedEvidence } from "./dist/evidence/vault.js";
          import { createSessionGraph } from "./dist/session/graph.js";

          await writeEncryptedEvidence(
            "session",
            "control-plane-qualification",
            {
              kind: "control-plane-qualification",
              actEnabled: false,
            },
          );

          await writeEncryptedEvidence(
            "recovery-automation",
            "control-plane-qualification",
            {
              targetId: "control-plane-qualification",
              status: "HEALTHY",
              actEnabled: false,
            },
          );

          const { graph } = createSessionGraph(
            ".runs/checkpoints/session.sqlite",
          );

          await graph.invoke(
            {
              request: "What is the current state?",
              provider: "AWS",
              engine: "TERRAFORM",
              fixture: true,
              approveBuild: false,
            },
            {
              configurable: {
                thread_id: "control-plane-qualification",
              },
            },
          );
          NODE

      - name: Capture verify drill and restore encrypted control plane
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/.runs/control-plane/stage"
          EVIDENCE="$RUNNER_TEMP/alz-control-plane-recovery.evidence"
          RESTORED="$RUNNER_TEMP/alz-control-plane-restored"
          REPORTS="$GITHUB_WORKSPACE/.runs/control-plane/reports"
          mkdir -p "$REPORTS"

          node "$STAGE/dist/cli/control-plane-recovery.js" capture             --root "$STAGE"             --evidence "$EVIDENCE"             --report "$REPORTS/capture.json"

          node "$STAGE/dist/cli/control-plane-recovery.js" verify             --evidence "$EVIDENCE"             --report "$REPORTS/verify.json"

          node "$STAGE/dist/cli/control-plane-recovery.js" drill             --evidence "$EVIDENCE"             --report "$REPORTS/drill.json"

          node "$STAGE/dist/cli/control-plane-recovery.js" restore             --evidence "$EVIDENCE"             --restore-root "$RESTORED"             --report "$REPORTS/restore.json"

          sha256sum "$EVIDENCE" > "$REPORTS/control-plane-recovery.evidence.sha256"

          cd "$RESTORED"
          npm ci --omit=dev
          node dist/cli/release-package.js --root . --verify
          ./alz help
          ./alz doctor

      - name: Verify restored encrypted evidence and checkpoint continuity
        shell: bash
        run: |
          set -euo pipefail
          RESTORED="$RUNNER_TEMP/alz-control-plane-restored"
          cd "$RESTORED"

          node --input-type=module <<'NODE'
          import { readEncryptedEvidence } from "./dist/evidence/vault.js";
          import { createSessionGraph } from "./dist/session/graph.js";

          const session = await readEncryptedEvidence(
            ".runs/evidence/session/control-plane-qualification.evidence",
          );
          const recovery = await readEncryptedEvidence(
            ".runs/evidence/recovery-automation/control-plane-qualification.evidence",
          );

          if (session.actEnabled !== false || recovery.actEnabled !== false) {
            throw new Error("Restored evidence violated the Preview/Operate boundary.");
          }

          const { graph } = createSessionGraph(
            ".runs/checkpoints/session.sqlite",
          );

          const result = await graph.invoke(
            {
              request: "Summarize the current state.",
              provider: "AWS",
              engine: "TERRAFORM",
              fixture: true,
              approveBuild: false,
            },
            {
              configurable: {
                thread_id: "control-plane-qualification",
              },
            },
          );

          if (!Array.isArray(result.history) || result.history.length < 2) {
            throw new Error("Restored checkpoint did not preserve prior session state.");
          }
          NODE

      - name: Upload recovery qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sovereign-lz-control-plane-recovery
          path: |
            .runs/control-plane/reports/*.json
            .runs/control-plane/reports/*.sha256
          if-no-files-found: warn
          retention-days: 30
