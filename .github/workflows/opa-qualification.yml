name: OPA Production Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/opa-qualification.yml"
      - "policy/opa/**"
      - "src/security/policy/**"
      - "src/qualification/opa-parity.ts"
      - "src/cli/opa-qualification.ts"
      - "test/opa-parity.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa-qualification:
    name: Pinned local OPA parity
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and targeted policy tests
        run: |
          npm run check
          ./node_modules/.bin/tsx --test test/security-policy.test.ts test/opa-parity.test.ts

      - name: Build qualification CLI
        run: npm run build

      - name: Download pinned OPA
        shell: bash
        run: |
          set -euo pipefail
          OPA_VERSION="1.21.1"
          OPA_SHA256="23c654cdb52fc80c3f30e85c0c884a15f78a10173d0a5a060aa25eac15f48fbb"
          curl --fail --location --silent --show-error             -o ./opa             "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64"
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          chmod +x ./opa
          ./opa version

      - name: Strict BUILTIN and OPA parity
        run: |
          node dist/cli/opa-qualification.js             --opa ./opa             --policy policy/opa/security.rego             --output .runs/qualification/opa-parity.json

      - name: Upload OPA qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-private-landing-zone-opa-qualification
          path: .runs/qualification/opa-parity.json
          if-no-files-found: warn
          retention-days: 30
