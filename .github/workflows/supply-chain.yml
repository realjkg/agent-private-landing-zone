name: Agent Private Landing Zone Supply Chain

on:
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docs/docker-runtime.md"
      - "test/docker-runtime*.test.ts"
      - "test/repository*.test.ts"
      - "test/release-package*.test.ts"
      - "src/cli/session.ts"
      - "src/session/graph.ts"
      - "src/release/**"
      - "src/cli/release-package.ts"
      - "src/cli/operator.ts"
      - "src/build/repository.ts"
      - "alz"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      release_phase:
        description: "Release phase or reason for full supply-chain qualification"
        required: true
        default: "release-candidate"
        type: string

permissions:
  contents: read

jobs:
  supply-chain:
    name: Verify, package, reproduce and scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type and regression checks
        run: |
          npm run check
          npm test
          npm run plugins:check

      - name: Build compiled runtime
        run: npm run build

      - name: Compiled operator design scenarios
        run: |
          ./alz design aws terraform brownfield
          ./alz design azure pulumi greenfield
          ./alz design aws opentofu brownfield
          ./alz design azure bicep brownfield
          ./alz design aws cloudformation brownfield
          ./alz design aws cdk brownfield
          ./alz design aws crossplane brownfield
          ./alz design aws ansible brownfield

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --package-lock-only > sbom.cdx.json

      - name: Stage Preview Operate artifact
        shell: bash
        run: |
          set -euo pipefail
          STAGE=".runs/release/stage"
          rm -rf ".runs/release"
          mkdir -p "$STAGE"
          cp -R dist "$STAGE/dist"
          cp -R policy "$STAGE/policy"
          cp -R config "$STAGE/config"
          cp package.json package-lock.json alz sbom.cdx.json "$STAGE/"
          chmod +x "$STAGE/alz"
          VERSION="$(node -p "require('./package.json').version")"
          node dist/cli/release-package.js             --root "$STAGE"             --source-commit "$GITHUB_SHA"             --version "$VERSION"
          node dist/cli/release-package.js             --root "$STAGE"             --verify

      - name: Prove deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE=".runs/release/stage"
          A=".runs/release/agent-private-landing-zone-a.tar.gz"
          B=".runs/release/agent-private-landing-zone-b.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C "$STAGE" -cf - . | gzip -n > "$A"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C "$STAGE" -cf - . | gzip -n > "$B"
          cmp "$A" "$B"
          cp "$A" ".runs/release/agent-private-landing-zone.tar.gz"
          sha256sum ".runs/release/agent-private-landing-zone.tar.gz" > ".runs/release/agent-private-landing-zone.tar.gz.sha256"

      - name: Clean production install smoke
        shell: bash
        run: |
          set -euo pipefail
          INSTALL="$(mktemp -d)"
          trap 'rm -rf "$INSTALL"' EXIT
          tar -xzf ".runs/release/agent-private-landing-zone.tar.gz" -C "$INSTALL"
          cd "$INSTALL"
          npm ci --omit=dev
          ./alz help
          node dist/cli/release-package.js --root . --verify
          ./alz doctor

      - name: Scan vulnerabilities and IaC configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results.json
          exit-code: "1"

      - name: Upload release and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-private-landing-zone-supply-chain
          path: |
            sbom.cdx.json
            trivy-results.json
            .runs/release/stage/release-manifest.json
            .runs/release/agent-private-landing-zone.tar.gz
            .runs/release/agent-private-landing-zone.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30

  docker-arm64-security:
    name: Build, test and scan Linux ARM64 Docker image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Linux ARM64 test image
        run: docker build --platform linux/arm64 --target test --build-arg SOURCE_COMMIT="${GITHUB_SHA}" -t agent-private-landing-zone:test .

      - name: Run Linux ARM64 deterministic tests
        run: docker run --rm --network none agent-private-landing-zone:test

      - name: Build Linux ARM64 release image with provenance
        run: |
          docker build --platform linux/arm64 --target runtime \
            --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            -t agent-private-landing-zone:ci-arm64 .

      - name: Verify native Linux ARM64 image
        run: |
          test "$(docker image inspect agent-private-landing-zone:ci-arm64 --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          docker run --rm --network none --entrypoint node agent-private-landing-zone:ci-arm64 \
            dist/cli/release-package.js --root /app --verify

      - name: Smoke final ARM64 runtime with native SQLite and operator
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node \
            agent-private-landing-zone:ci-arm64 \
            -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); try { if (db.prepare('select 1 as value').get().value !== 1) process.exit(2); } finally { db.close(); }"
          docker run --rm --network none agent-private-landing-zone:ci-arm64 help

      - name: Scan final runtime image for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agent-private-landing-zone:ci-arm64
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image-results.json
          exit-code: "1"

      - name: Upload Docker security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-private-landing-zone-docker-arm64-security
          path: trivy-image-results.json
          if-no-files-found: warn
          retention-days: 30
