name: Agent Private Landing Zone Supply Chain

on:
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "src/release/**"
      - "src/cli/release-package.ts"
      - "src/cli/operator.ts"
      - "src/build/repository.ts"
      - "alz"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      release_phase:
        description: "Release phase or reason for full supply-chain qualification"
        required: true
        default: "release-candidate"
        type: string

permissions:
  contents: read

jobs:
  supply-chain:
    name: Verify, package, reproduce and scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type and regression checks
        run: |
          npm run check
          npm test
          npm run plugins:check

      - name: Build compiled runtime
        run: npm run build

      - name: Compiled operator design scenarios
        run: |
          ./alz design aws terraform brownfield
          ./alz design azure pulumi greenfield
          ./alz design aws opentofu brownfield
          ./alz design azure bicep brownfield
          ./alz design aws cloudformation brownfield
          ./alz design aws cdk brownfield
          ./alz design aws crossplane brownfield
          ./alz design aws ansible brownfield

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --package-lock-only > sbom.cdx.json

      - name: Stage Preview Operate artifact
        shell: bash
        run: |
          set -euo pipefail
          STAGE=".runs/release/stage"
          rm -rf ".runs/release"
          mkdir -p "$STAGE"
          cp -R dist "$STAGE/dist"
          cp -R policy "$STAGE/policy"
          cp -R config "$STAGE/config"
          cp package.json package-lock.json alz sbom.cdx.json "$STAGE/"
          chmod +x "$STAGE/alz"
          VERSION="$(node -p "require('./package.json').version")"
          node dist/cli/release-package.js             --root "$STAGE"             --source-commit "$GITHUB_SHA"             --version "$VERSION"
          node dist/cli/release-package.js             --root "$STAGE"             --verify

      - name: Prove deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE=".runs/release/stage"
          A=".runs/release/agent-private-landing-zone-a.tar.gz"
          B=".runs/release/agent-private-landing-zone-b.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C "$STAGE" -cf - . | gzip -n > "$A"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C "$STAGE" -cf - . | gzip -n > "$B"
          cmp "$A" "$B"
          cp "$A" ".runs/release/agent-private-landing-zone.tar.gz"
          sha256sum ".runs/release/agent-private-landing-zone.tar.gz" > ".runs/release/agent-private-landing-zone.tar.gz.sha256"

      - name: Clean production install smoke
        shell: bash
        run: |
          set -euo pipefail
          INSTALL="$(mktemp -d)"
          trap 'rm -rf "$INSTALL"' EXIT
          tar -xzf ".runs/release/agent-private-landing-zone.tar.gz" -C "$INSTALL"
          cd "$INSTALL"
          npm ci --omit=dev
          ./alz help
          node dist/cli/release-package.js --root . --verify
          ./alz doctor

      - name: Scan vulnerabilities and IaC configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results.json
          exit-code: "1"

      - name: Upload release and qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-private-landing-zone-supply-chain
          path: |
            sbom.cdx.json
            trivy-results.json
            .runs/release/stage/release-manifest.json
            .runs/release/agent-private-landing-zone.tar.gz
            .runs/release/agent-private-landing-zone.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30
