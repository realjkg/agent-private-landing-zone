name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # Docs are skipped except the two generated tables guarded by tests;
    # later patterns win, so those two re-enter after the exclusions.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/PULL_REQUEST_TEMPLATE/**"
      - "docs/operator-console.md"
      - "docs/cli-ui-journey-map.md"

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Affected code QA
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout (including merge base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The scope planner uses only built-in Node modules. It runs before
      # npm ci, so docs-only and unknown-ownership changes cost no install.
      # Diff SHA values are environment variables, never interpolated in shell.
      # A coverage gap fails here. A selection over the cap with no other gap
      # sets route=full-suite: the full suite for this exact head is the gate.
      - name: Select affected tests
        id: scope
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/qa-affected.mjs plan --base "$QA_BASE" --head "$QA_HEAD" --full-suite-over-cap

      - name: Node
        if: steps.scope.outputs.needs_deps == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies only when needed
        if: steps.scope.outputs.needs_deps == 'true'
        run: npm ci

      # The local coding-agent command uses this same runner. No full
      # regression, full-codebase typecheck, or release deploy on normal PRs.
      - name: Run affected QA
        if: steps.scope.outputs.route != 'full-suite'
        run: node scripts/qa-affected.mjs run --plan .runs/qa/plan.json

      # Over the cap only: the plan's pin, type, .mjs, Python and plugin
      # checks still run, and npm test replaces the selected node/UI tests.
      - name: "Over cap: running the full suite as the release gate"
        if: steps.scope.outputs.route == 'full-suite'
        run: node scripts/qa-affected.mjs run --plan .runs/qa/plan.json --full-suite-over-cap
