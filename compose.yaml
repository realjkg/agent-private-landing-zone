services:
  alz:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SOURCE_COMMIT: ${ALZ_SOURCE_COMMIT:-}
    image: agent-private-landing-zone:local
    init: true
    environment:
      NODE_ENV: production
      AGENTIC_EVIDENCE_KEY_FILE: /run/alz-keys/evidence.key
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - alz-runtime-data:/app/.runs
      - alz-evidence-keys:/run/alz-keys:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  alz-runtime-data:
    external: true
  alz-evidence-keys:
    external: true
